# Custom langvio configuration

llm:
  default: "qwen"
  models:
    qwen:
      model_name: "Qwen/Qwen2.5-VL-3B-Instruct"
      model_kwargs:
        temperature: 0.2
        max_new_tokens: 1024

    qwen-7b:
      model_name: "Qwen/Qwen2.5-VL-7B-Instruct"
      model_kwargs:
        temperature: 0.2
        max_new_tokens: 1024

vision:
  default: "yolo"
  models:
    yolo:
      type: "yolo"
      model_path: "yolov8x.pt"  # Using a larger model
      confidence: 0.3

    yolo_fast:
      type: "yolo"
      model_path: "yolov8n.pt"  # Using a smaller, faster model
      confidence: 0.25

media:
  output_dir: "./custom_output"
  temp_dir: "./temp"
  visualization:
    box_color: [0, 0, 255]  # Red boxes
    text_color: [255, 255, 255]  # White text
    line_thickness: 3

logging:
  level: "INFO"
  file: "langvio.log"