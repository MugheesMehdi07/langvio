# Default langvio configuration
# Note: API keys must be provided through environment variables, never here.
#
# Backend: every qwen processor below talks to a hosted Qwen-VL model over an
# OpenAI-compatible API (the default, backend: "api") and needs
# OPENROUTER_API_KEY (or QWEN_API_KEY) set in your environment / .env file.
# Set backend: "local" (or LANGVIO_BACKEND=local) to download the weights and
# run them in-process instead - that needs `pip install langvio[vlm]`.
#
# API options per model entry: api_model, api_base_url, api_key_env,
# api_extra_body, api_timeout, api_max_retries; or env QWEN_API_MODEL /
# QWEN_API_BASE_URL / QWEN_API_KEY. Default: qwen/qwen3-vl-30b-a3b-instruct on
# OpenRouter. The `model_name` entries below apply to the local backend only.
llm:
  default: "qwen"
  models:
    qwen:
      model_name: "Qwen/Qwen2.5-VL-3B-Instruct"
      api_model: "qwen/qwen3-vl-30b-a3b-instruct"
      model_kwargs:
        temperature: 0.2
        max_new_tokens: 1024

    qwen-3b:
      model_name: "Qwen/Qwen2.5-VL-3B-Instruct"
      api_model: "qwen/qwen3-vl-8b-instruct"
      model_kwargs:
        temperature: 0.2
        max_new_tokens: 1024

    qwen-7b:
      model_name: "Qwen/Qwen2.5-VL-7B-Instruct"
      api_model: "qwen/qwen3-vl-30b-a3b-instruct"
      model_kwargs:
        temperature: 0.2
        max_new_tokens: 1024

    qwen2-vl-7b:
      model_name: "Qwen/Qwen2-VL-7B-Instruct"
      api_model: "qwen/qwen2.5-vl-72b-instruct"
      model_kwargs:
        temperature: 0.2
        max_new_tokens: 1024

vision:
  # Vision layer: Qwen-VL grounding (the same model as the llm layer above).
  default: "qwen_vlm"
  models:
    qwen_vlm:
      type: "vlm"
      api_model: "qwen/qwen3-vl-30b-a3b-instruct"
      model_name: "Qwen/Qwen2.5-VL-3B-Instruct"  # local backend only
      confidence: 0.9          # VLM gives no per-box score; assigned to every box
      max_image_size: 1024     # Longest side fed to the model (larger is slower and less stable)
      max_new_tokens: 1024
      max_video_frames: 24     # Max keyframes analysed per video (seconds per frame)
      keyframes_per_second: 1.0  # Boxes are interpolated between keyframes
      scene_description: true  # VLM describes the scene for the explanation step
      scene_frames: 4
      nms_iou: 0.6
      api_concurrency: 4       # Parallel keyframe requests (API backend)

    qwen_vlm_3b:
      type: "vlm"
      api_model: "qwen/qwen3-vl-8b-instruct"
      model_name: "Qwen/Qwen2.5-VL-3B-Instruct"
      confidence: 0.9
      max_image_size: 1024
      max_new_tokens: 1024
      max_video_frames: 24

    qwen_vlm_7b:
      type: "vlm"
      api_model: "qwen/qwen3-vl-235b-a22b-instruct"
      model_name: "Qwen/Qwen2.5-VL-7B-Instruct"
      confidence: 0.9
      max_image_size: 1024
      max_new_tokens: 1024
      max_video_frames: 24

    # Legacy YOLO models (require ultralytics)
    yolo11n:  # Fastest YOLO11 model
      type: "yolo"
      model_path: "yolo11n.pt"
      confidence: 0.8
      model_type: "yolo"
      
    yoloe:
      type: "yolo"
      model_path: "yoloe-11s-seg-pf.pt"  # YOLOe nano - fastest
      confidence: 0.8
      model_type: "yoloe"

    yoloe_medium:
        type: "yolo"
        model_path: "yoloe-11m-seg-pf.pt"  # YOLOe medium - balanced
        confidence: 0.5
        model_type: "yoloe"

    yoloe_large:
        type: "yolo"
        model_path: "yoloe-11l-seg-pf.pt"  # YOLOe extra large - most accurate
        confidence: 0.5
        model_type: "yoloe"
    yolo:
      type: "yolo"
      model_path: "yolo11n.pt"  # Default: smallest/fastest model
      confidence: 0.7
    yolo_medium:
      type: "yolo"
      model_path: "yolo11m.pt"  # Medium model - balanced
      confidence: 0.5
    yolo_large:
      type: "yolo"
      model_path: "yolo11x.pt"  # Large model - most accurate
      confidence: 0.5

media:
  output_dir: "./output"
  temp_dir: "./temp"
  visualization:
    box_color: [0, 255, 0]  # Green boxes
    text_color: [255, 255, 255]  # White text
    line_thickness: 2
    show_attributes: true
    show_confidence: true

# Performance optimization settings
performance:
  # Video processing optimizations
  video:
    # Frame sampling for different tasks
    counting_sampling_interval: 2  # Every 2nd frame for counting
    tracking_sampling_interval: 3  # Every 3rd frame for tracking
    general_sampling_interval: 5   # Every 5th frame for general analysis
    
    # Memory management
    memory_cleanup_interval: 50    # Clean memory every 50 frames
    max_detections_per_frame: 50   # Limit detections per frame
    
    # Attribute analysis intervals
    color_analysis_interval: 5     # Color analysis every 5th frame
    spatial_analysis_interval: 5   # Spatial analysis every 5th frame
    
  # Detection optimizations
  detection:
    iou_threshold: 0.45           # Lower IoU for speed
    max_detections: 50            # Limit max detections
    use_half_precision: true      # Use FP16 if available
    agnostic_nms: true           # Use agnostic NMS
    disable_augmentation: true    # Disable test-time augmentation
    
  # GPU optimizations
  gpu:
    enable_cudnn_benchmark: true  # Enable cuDNN benchmark
    enable_tf32: true            # Enable TF32 for speed
    memory_fraction: 0.8         # Use 80% of GPU memory

logging:
  level: "INFO"
  file: "langvio.log"